<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function add(a,b){
            return a+b;
        }

        console.log(add(10,20));

        const add2 = function(a,b){
            return a+b;
        }

        console.log(add2(10,20));


        function add3(){
            let a = 10;
            let b = 20;
            return function(c,d){
                return a+b+c+d;
            }
        }

        //closues concepts
        const add4 = add3();
        console.log(add4(10,20));  //60

        const add5 = (a,b)=>{
            return a+b; 
        }

        const add6 = new Function("a","b","return a+b;");
        console.log(add6(10,20));


        //self invoke function
        //module hoá chương trình ngày xưa
       (
        function(){
            console.log("Hello world");
        }
       )();


       
    </script>
</body>
</html>
