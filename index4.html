<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <script>
        function add(a,b,func){
            const sum = a+b;
            func(sum);
        }

        add(10,20,function(sum){
             const newSum= sum+10;
             console.log(newSum);
        })

        add(10,20,function(sum){
             const newSum= sum*10;
             console.log(newSum);
        })



        const arr = [1,2,3,4,5,6];

        function myMap(arr, func){
            const newArr = [];
            for(let i=0; i < arr.length; i++){
                const newItem = func(arr[i]);
                newArr.push(newItem);   
            }
            return newArr;
        }

        const newArr = myMap(arr, function(item){
            return item*2;
        });

        console.log(newArr);
     </script>
</body>
</html>
