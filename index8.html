<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function add(a,b,func){
            setTimeout(()=>{
               func(a+b);
            },3000)
        }

        add(10,20,function(sum){
            console.log(sum);
        })

        function add2(a,b){
            return new Promise((resolve, reject)=>{
                setTimeout(()=>{
                    resolve(a+b);
                },3000)
            })
        }

        add2(10,20).then(function(sum){
            console.log(sum);
        })

        async function divide(a,b){
            return await new Promise((res,rej)=>{
                if(b==0){
                    rej("Erro: divide by zero");
                }
                res(a/b);
            })
        }

/* 
        divide(10,0).then((result)=>{
            alert(result);
        }).catch((err)=>{
            alert(err);
        }) */

      (async function(){
        try {
           const result = await divide(10,20); 
           alert(result);
        } catch (error) {
            console.log(error);
        }
      })();

    </script>
</body>
</html>
