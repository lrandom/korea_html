<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            margin:0px auto;
            width:600px;
            padding:10px;
        }

        ul,li{
            margin: 0px;
            padding: 0px;
        }

        li{
            list-style-type: none;
        }

        .news_list--item--image{
            width:100%;
            max-height: 300px;
            object-fit: cover;
        }

        .news_list--item{
            background: #f6f5f5;
            padding: 10px;
            box-shadow: inset;
            border-radius: 10px;
        }
    </style>
</head>
<body>
     <div class="container">
           <h1>News Application</h1>     
           <ul class="news_list">
           </ul>
     </div>

     <script>
        (async function(){
            const resp = await fetch("https://newsapi.org/v2/everything?q=tesla&from=2025-08-24&sortBy=publishedAt&apiKey=33426eaf1f124fe0b7c3eb9277daa942");
            if(resp.ok){
                const data = await resp.json();
                console.log(data);
                const articles = data.articles;
                const newsList = document.querySelector('.news_list');
                let itemsInnerContent = "";
                for (let i = 0; i < articles.length; i++) {
                    const newItems = articles[i];
                    const title = newItems.title;
                    const urlToImage = newItems.urlToImage;
                    const url = newItems.url;
                    const description = newItems.description;
                    itemsInnerContent+=`<li class="news_list--item">
                 <h4 class="news_list--item--title">
                    <a href="${url}" target="_blank">
                    ${title}
                    </a>
                </h4>
                 <img
                  class="news_list--item--image"
                 src="${urlToImage}"/>
                 <p class="news_list--item--description">
                 ${description}
                 </p>
              </li>`
                }
                newsList.innerHTML = itemsInnerContent;
            }
        })()
     </script>
</body>
</html>
