<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            margin:0px auto;
            width:600px;
            padding:10px;
        }

        ul,li{
            margin: 0px;
            padding: 0px;
        }

        li{
            list-style-type: none;
        }

        .news_list--item--image{
            width:100%;
            max-height: 300px;
            object-fit: cover;
        }

        .news_list--item{
            background: #f6f5f5;
            padding: 10px;
            box-shadow: inset;
            border-radius: 10px;
        }

        .loading{
            position: fixed;
            top:0;
            bottom:0;
            left:0;
            right: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .loading > div{
            width:50px;
        }

        .loading.hidden{
            display: none;
        }
    </style>
</head>
<body>
     <div class="container">
           <h1>News Application</h1>   
           <form onsubmit="return handleSearch()">
                <input type="text" class="search_input" placeholder="Tim thong tin, vui long nhap tu khoa"/>  
                <button>Search</button>
            </form>
           <ul class="news_list">
           </ul>

           <div class="loading hidden">
             <div>
                <svg fill="hsl(228, 97%, 42%)" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12,1A11,11,0,1,0,23,12,11,11,0,0,0,12,1Zm0,19a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z" opacity=".25"/><path d="M12,4a8,8,0,0,1,7.89,6.7A1.53,1.53,0,0,0,21.38,12h0a1.5,1.5,0,0,0,1.48-1.75,11,11,0,0,0-21.72,0A1.5,1.5,0,0,0,2.62,12h0a1.53,1.53,0,0,0,1.49-1.3A8,8,0,0,1,12,4Z"><animateTransform attributeName="transform" type="rotate" dur="0.75s" values="0 12 12;360 12 12" repeatCount="indefinite"/></path></svg>
             </div>
           </div>
     </div>

     <script>
        function handleSearch(){
            //chan hanh vi submit mac dinh cua form
            const searchInput = document.querySelector('.search_input');
            const searchValue = searchInput.value;
            console.log(searchValue);
            getNews(searchValue);
            return false;
        }

        async function getNews(searchQuery){
            const loadingNode = document.querySelector('.loading');
            loadingNode.classList.remove('hidden');
            const resp = await fetch(`https://newsapi.org/v2/everything?q=${searchQuery}&from=2025-08-24&sortBy=publishedAt&apiKey=33426eaf1f124fe0b7c3eb9277daa942`);
            loadingNode.classList.add('hidden');
            if(resp.ok){
                const data = await resp.json();
                const articles = data.articles;
                const newsList = document.querySelector('.news_list');
                let itemsInnerContent = "";
                for (let i = 0; i < articles.length; i++) {
                    const newItems = articles[i];
                    const title = newItems.title;
                    const urlToImage = newItems.urlToImage;
                    const url = newItems.url;
                    const description = newItems.description;
                    itemsInnerContent+=`<li class="news_list--item">
                 <h4 class="news_list--item--title">
                    <a href="${url}" target="_blank">
                    ${title}
                    </a>
                </h4>
                 <img
                  class="news_list--item--image"
                 src="${urlToImage}"/>
                 <p class="news_list--item--description">
                 ${description}
                 </p>
              </li>`
                }
                newsList.innerHTML = itemsInnerContent;
            }
        }
     </script>
</body>
</html>
