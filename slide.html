<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
   <div class="slide">
        <div class="slide_item">
            <img  src="imgs/1.webp" />
        </div>

        <div class="slide_item">
            <img  src="imgs/2.jpg" />
        </div>

        <div class="slide_item">

        </div>

    <style>
        .slide{
            position: relative;
            margin:0px auto;
            width:800px;
        }

            width:800px;
            height: 400px;
            overflow: hidden;
            position: absolute;
        }

        .slide_item img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
